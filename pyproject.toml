[build-system]
requires = ["setuptools>=77.0", "wheel", "cmake>=3.15", "pybind11>=2.10"]
build-backend = "setuptools.build_meta"

[project]
name = "pyfastyaml"
version = "0.1.0b4"
description = "Fast YAML parser for Python with C++/SIMD backend"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "FastYAML Contributors"}
]
keywords = ["yaml", "parser", "fast", "simd", "performance", "kubernetes", "ansible"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-benchmark", "PyYAML>=6.0", "ruamel.yaml>=0.18", "build", "twine"]

[project.urls]
Homepage = "https://github.com/baksvell/FastYAML"
Documentation = "https://github.com/baksvell/FastYAML#readme"
Repository = "https://github.com/baksvell/FastYAML"
Issues = "https://github.com/baksvell/FastYAML/issues"
"PyPI" = "https://pypi.org/project/pyfastyaml/"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
filterwarnings = ["ignore:SetuptoolsDeprecationWarning"]

[tool.setuptools]
packages = ["pyfastyaml"]

[tool.setuptools.package-data]
pyfastyaml = ["py.typed"]
