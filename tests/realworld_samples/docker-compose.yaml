# Docker Compose (block-style)
version: "3.8"
services:
  web:
    image: "nginx:alpine"
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
    volumes:
      - "./static:/usr/share/nginx/html"
    depends_on:
      - db
  db:
    image: "postgres:14"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: myapp
    volumes:
      - "postgres_data:/var/lib/postgresql/data"
volumes:
  postgres_data:
